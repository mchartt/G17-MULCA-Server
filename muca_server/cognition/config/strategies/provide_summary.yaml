id: provide_summary
modalities: [text, audio]
trigger_description: >
  Someone is directly asking for a recap or summary of the conversation (e.g.
  "can you summarize what we've talked about", "what have we discussed so
  far", "give me a recap"). This is a direct request, not something to infer
  from general conversation drift.
trigger_variables: []
prompt_template: |
  Someone asked for a summary. {prompt_fragment}
  Base your answer on both the overall summary (decisions, contributions,
  action points) and the retrieved recent conversation below -- the overall
  summary covers the whole conversation so far, including anything from
  before the retrieved window; the retrieved messages are what's been said
  most recently, verbatim, which the overall summary may not have folded in
  yet. Write it for a human to read: clear, well-organized, and easy to
  skim, not the internal, LLM-oriented phrasing of the summary itself.
  Structure it around: key decisions made, each person's main
  contributions (by name -- don't pad out someone who's barely
  contributed to sound even with the others), and any open action points
  still outstanding. Leave out a section if there's genuinely nothing to
  put in it, rather than forcing an empty one.
