id: participation_equality_text
modalities: [text]
trigger_description: >
  Participation is unequal in the text channel -- one or more speakers are
  getting little space to contribute relative to others, among those present
  in text. participant_message_counts and participant_shares tell you who
  specifically, so you can invite the quietest participant by name/mention
  rather than speaking generically.
  Lower priority than respond_when_addressed: if the current message also
  directly addresses MULCA with a question or request, select that instead
  -- the imbalance can simply wait for a later message, it does not need to
  be handled in the same turn as a direct question. If a quiet nudge still
  feels worth including alongside that other reply, set nudge_participation
  instead of selecting this as the primary strategy.
trigger_threshold:
  variable: gini_index
  min: 0.3
# Deliberately long: a team often has one person doing the actual typing
# (querying MULCA, say) while the rest contribute by talking the message
# through out loud or in voice -- a legitimate division of labor, not
# unfairness, and a short cooldown nagged about it too often. Firing
# rarely still catches a real, sustained imbalance.
cooldown_messages: 15
trigger_variables:
  - gini_index
  - participant_message_counts
  - participant_shares
  - message_count
# Only one response approach is implemented for now: inviting a quiet
# participant. "Interrupt the dominant speaker" is a deliberately deferred
# alternative -- see BLUEPRINT.md and core/strategies.py's Strategy dataclass
# if/when a second response mode is added; it would need its own
# prompt_template variant (or a response_mode the intervention agent picks),
# not a rewrite of this file's structure.
#
# Split from the old single participation_equality into this (text) and
# participation_equality_voice: text and voice have their own separate
# participant rosters and separate message counts (someone present in the
# voice call who never types has no text participation to measure, and vice
# versa), so one shared gini_index/participant_message_counts would have
# conflated two different audiences.
prompt_template: |
  Participation in the text channel is currently unbalanced. {prompt_fragment}
  Gently invite the quietest participant to share their view, without singling
  out or criticizing whoever has been talking the most.
# Used instead of prompt_template when this rides along on top of a
# different primary strategy -- a brief aside, not the focus of the reply.
overlay_template: >
  Briefly invite the quietest participant to share their view too -- one
  short aside, not the focus of your reply, without singling out or
  criticizing whoever has been talking the most.
