id: respond_when_addressed
modalities: [text, audio]
trigger_description: >
  You (MULCA) are the SOLE intended recipient of the message -- not the
  group. This includes: an explicit Discord @-mention of you; the message
  naming you by name ("MULCA") in plain text; a follow-up that is clearly
  and only a reply to your own immediately preceding message (e.g. "could
  you check that?"), continuing a one-on-one exchange you were just having,
  even without naming you explicitly; and a question about a specific detail
  from earlier in the conversation that is directed at you specifically
  (e.g. "what did I say about X", "did we already decide Y") -- for that
  last case, also set needs_history so you can answer accurately rather than
  guessing from what's currently visible to you. Do NOT select this for a
  message directed at the group, even if it continues a topic you raised,
  references something you said in passing, or would make sense as an
  answer to your own question if another participant had asked it instead
  -- a comment meant for everyone is not addressed to you just because it's
  on the same subject. In a private DM, there is no other possible audience,
  so almost any substantive message qualifies -- the only judgment left
  there is whether the specific message actually warrants a reply right
  now, not who it's for.
  This takes priority over unsolicited strategies (participation_equality_text/
  _voice, keep_on_topic) whenever both would otherwise apply to the same
  message: answer the direct question now. An unequal-participation nudge
  that has to wait a message or two is a minor cost; a direct question
  that goes unanswered reads as MULCA ignoring the person who asked it,
  especially in voice.
# Deliberately no cooldown_messages here, unlike participation_equality/
# keep_conversation_on_topic -- those are unsolicited interventions that get
# naggy if repeated too soon, but this fires only in direct response to being
# addressed, so a back-and-forth exchange needs it to be able to fire on
# consecutive messages.
trigger_variables: []
prompt_template: |
  You were addressed directly. {prompt_fragment}
  Answer them directly -- be concise unless the question warrants more detail.
