id: respond_when_addressed
modalities: [text, audio]
trigger_description: >
  Fire ONLY on one of these two explicit cases -- never on an inference
  from topic, context, or conversational flow:
  (1) An explicit mention of YOUR OWN name -- an actual Discord @-mention,
  or the message naming you in plain text by name or role. Your name is
  "MULCA". Voice transcription is often wrong, so judge this by SOUND, not
  spelling -- treat any short word or two-word greeting target as a match
  for "MULCA" if it roughly keeps the "M...L...C/K..." sound skeleton (two
  syllables, starting with an M sound, an L in the middle, a hard C/K/G
  sound closing it or just after the L), regardless of exact vowels or
  spelling -- "malca", "mulka", "muca", "malka", "molka", "mlaka", "malko"
  and similar near-misses are ALL matches, not just the handful spelled out
  here; this is a sound pattern to recognize, not a fixed list to compare
  against. Likewise for the role words "assistant" and "bot": accept any
  translation, plural, or compound of either (e.g. "assistent", "bots",
  "chatbot", "chat bot", "the bot") the same way you'd accept them in
  English -- the point is the role being named, not the exact word. A
  greeting or address naming ANY OTHER participant instead (e.g. "hey
  Pietro", "thanks Ada") is NOT addressed to you, even though it has the
  exact same "greeting + name" shape as a real one -- check WHICH name is
  said, not just that a name-like address pattern is present. The name or
  role must be said TO you, calling on you ("MULCA, ...", "bot, can
  you..."): talking ABOUT you in the third person ("MULCA keeps assuming
  Italy", "the bot interrupts too much", "it changed state") is NOT an
  address, however often your name comes up.
  (2) The message is itself a reply to your own immediately preceding
  message (not merely on the same subject as something you said) AND it
  explicitly says "you" or names you again within that reply (e.g. "could
  you check that?", "are you sure, MULCA?"). BOTH parts are required --
  the word "you" appearing anywhere is NOT enough by itself. If you did
  not just say something immediately before this message, there is
  nothing for it to be a reply to, so any "you" in it refers to someone
  else in the group, not you, no matter who else the message happens to
  be directed at (e.g. "hey Pietro, can you grab the notes?" says "you"
  but means Pietro -- not addressed to you at all). A reply to your
  message that contains neither is NOT enough on its own -- do not infer
  address from topic continuity, conversational flow, or it "making
  sense" as a response to you. A bare greeting or short fragment with no
  literal name match or "you" is NOT enough either, no matter how
  directed-sounding or conversational it feels -- e.g. a lone "hello" or
  a short question fragment is not addressed to you just because you're
  the only other party in the conversation.
  If the message asks about a specific detail from earlier in the
  conversation (e.g. "what did I say about X", "did we already decide Y")
  AND satisfies (1) or (2) above, also set needs_history so you can answer
  accurately rather than guessing from what's currently visible to you.
  Cases (1) and (2) above are the ONLY ways to fire, with no exception,
  regardless of channel type or how many people are present or talking --
  someone talking alone out loud (thinking out loud, talking to someone
  off-mic, muttering, narrating) is completely normal and is NOT
  automatically addressed to you just because no one else is currently
  speaking. A bare "what's going on?", "hey!", or any other generic remark
  with no name match and no "you"/reply structure stays None no matter how
  isolated or conversational it sounds, and no matter how recently you last
  spoke.
  This takes priority over unsolicited strategies (participation_equality_text/
  _voice, maintain_focus, resolve_conflict) whenever both would otherwise
  apply to the same message: answer the direct question now. An
  unequal-participation nudge, an off-topic redirect, or a conflict
  summary that has to wait a message or two is a minor cost; a direct
  question that goes unanswered reads as MULCA ignoring the person who
  asked it, especially in voice.
# Deliberately no cooldown_messages here, unlike participation_equality/
# maintain_focus/resolve_conflict -- those are unsolicited interventions
# that get naggy if repeated too soon, but this fires only in direct
# response to being addressed, so a back-and-forth exchange needs it to be
# able to fire on consecutive messages.
trigger_variables: []
prompt_template: |
  You were addressed directly. {prompt_fragment}
  Answer them directly.
