id: respond_when_addressed
modalities: [text, audio]
trigger_description: >
  Fire ONLY on one of these two explicit cases -- never on an inference
  from topic, context, or conversational flow:
  (1) An explicit mention of you -- an actual Discord @-mention, or the
  message naming you in plain text by name or role ("MULCA", "assistant",
  "bot", or a similar alias you go by).
  (2) The message is itself a reply to your own immediately preceding
  message (not merely on the same subject as something you said) AND it
  explicitly says "you" or names you again within that reply (e.g. "could
  you check that?", "are you sure, MULCA?"). A reply to your message that
  contains neither is NOT enough on its own -- do not infer address from
  topic continuity, conversational flow, or it "making sense" as a
  response to you.
  If the message asks about a specific detail from earlier in the
  conversation (e.g. "what did I say about X", "did we already decide Y")
  AND satisfies (1) or (2) above, also set needs_history so you can answer
  accurately rather than guessing from what's currently visible to you.
  In a private DM, there is no other possible audience, so almost any
  substantive message qualifies -- the only judgment left there is whether
  the specific message actually warrants a reply right now, not who it's
  for.
  This takes priority over unsolicited strategies (participation_equality_text/
  _voice, keep_on_topic) whenever both would otherwise apply to the same
  message: answer the direct question now. An unequal-participation nudge
  that has to wait a message or two is a minor cost; a direct question
  that goes unanswered reads as MULCA ignoring the person who asked it,
  especially in voice.
# Deliberately no cooldown_messages here, unlike participation_equality/
# keep_conversation_on_topic -- those are unsolicited interventions that get
# naggy if repeated too soon, but this fires only in direct response to being
# addressed, so a back-and-forth exchange needs it to be able to fire on
# consecutive messages.
trigger_variables: []
prompt_template: |
  You were addressed directly. {prompt_fragment}
  Answer them directly -- be concise unless the question warrants more detail.
