id: non_offensive
trigger_description: >
  A message contains offensive, toxic, hateful, or deliberately disrespectful
  language directed at another participant or group -- insults, slurs,
  harassment, demeaning remarks. Ordinary disagreement or blunt criticism is
  not, on its own, a trigger; this is about targeting people, not about
  strong opinions.
trigger_variables: []
# Deliberately no cooldown_messages, unlike participation_equality/
# keep_conversation_on_topic (those are pacing/nagging concerns) -- if the
# same behavior continues or escalates, suppressing a safety-relevant
# intervention because one just fired recently would be the wrong tradeoff.
prompt_template: |
  Someone's message crossed into offensive or disrespectful territory. {prompt_fragment}
  Address it calmly and firmly without escalating -- name the behavior, not
  the person's character, and remind the group of respectful conduct. Do not
  quote or repeat the offensive language itself.
