# Builds the Docker image into this project's GitLab container registry, on
# every push to GitLab (git push gitlab <branch>).
#
# Each build is tagged with its commit (what a deploy should name) and with
# its branch (always the branch's newest build).
build-image:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # This job's own registry login. Where dind can't start, the runner's
    # host daemon is shared, and a shared login can be overwritten by a
    # concurrent job (e.g. MULCA's) with a token this project can't use --
    # the likely cause of a push refused right after a successful login.
    DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"
  rules:
    - if: $CI_COMMIT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push --all-tags "$CI_REGISTRY_IMAGE"
