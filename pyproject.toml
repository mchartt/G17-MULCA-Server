[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muca-server"
version = "0.1.0"
description = "Multi-User Conversational Agent server and WebSocket protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "numpy>=1.26,<3",
    # Day boundaries in Europe/Rome (cognition/memory/day_memory.py); slim
    # images and Windows ship no time zone data.
    "tzdata",
]

[project.optional-dependencies]
server = [
    "uvicorn[standard]>=0.30,<1",
]
openai = [
    "openai[realtime]>=2.0,<3",
    "python-dotenv>=1,<2",
]
storage = [
    "aiosqlite>=0.19,<1",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "aiosqlite>=0.19,<1",
]

[tool.setuptools]
packages = [
    "muca_server",
    "muca_server.agents",
    "muca_server.agents.openai",
    "muca_server.audio",
    "muca_server.cognition",
    "muca_server.cognition.memory",
    "muca_server.cognition.coordination",
    "muca_server.events",
    "muca_server.protocol",
    "muca_server.sessions",
]

[tool.setuptools.package-data]
"muca_server.cognition" = ["config/**/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
