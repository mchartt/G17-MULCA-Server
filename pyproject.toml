[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muca-server"
version = "0.1.0"
description = "Multi-User Conversational Agent server and WebSocket protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
server = [
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools]
packages = [
    "muca_server",
    "muca_server.audio",
    "muca_server.events",
    "muca_server.protocol",
    "muca_server.sessions",
    "muca_server.text",
]
